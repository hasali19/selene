<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 96" width="360" height="96">
  <defs>
    <linearGradient id="moonGrad" x1="8%" y1="6%" x2="92%" y2="96%">
      <stop offset="0%" stop-color="#e0e7ff"/>
      <stop offset="45%" stop-color="#a5b4fc"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="orbitGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#a5b4fc" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a5b4fc" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#a5b4fc" stop-opacity="0"/>
    </radialGradient>
    <mask id="crescentMask">
      <rect width="128" height="128" fill="black"/>
      <circle cx="60" cy="64" r="40" fill="white"/>
      <circle cx="78" cy="54" r="34" fill="black"/>
    </mask>
  </defs>

  <g transform="translate(-16 -16) scale(0.8)">
    <circle cx="60" cy="64" r="60" fill="url(#glow)"/>
    <ellipse cx="64" cy="64" rx="52" ry="20" transform="rotate(-18 64 64)"
             fill="none" stroke="url(#orbitGrad)" stroke-width="2"/>
    <circle cx="60" cy="64" r="40" fill="url(#moonGrad)" mask="url(#crescentMask)"/>
    <circle cx="105.9" cy="63.9" r="3.2" fill="#c7d2fe"/>
    <circle cx="22.1" cy="64.1" r="2" fill="#a5b4fc"/>
    <circle cx="100" cy="24" r="1.6" fill="#c7d2fe" opacity="0.8"/>
    <circle cx="24" cy="106" r="1.4" fill="#c7d2fe" opacity="0.7"/>
  </g>

  <text x="112" y="65" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="42" font-weight="600" letter-spacing="1" fill="#f1f0ff">selene</text>
</svg>
