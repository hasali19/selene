---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# image will be published to ghcr.io/<user>/<name>
name: selene
# description will be included in the image's metadata
description: This is my personal OS image.

# the base image to build on top of (FROM) and the version tag to use
base-image: ghcr.io/ublue-os/base-main
image-version: 44 # latest is also supported if you want new updates ASAP

# module configuration, executed in order
# you can include multiple instances of the same module
modules:
  - type: script
    scripts:
      - install-kernel.sh
      - build-initramfs.sh

  - type: files
    files:
      - source: system
        destination: / # copies files/system/* (* means everything inside it) into your image's root folder /

  - type: dnf
    install:
      packages:
        - adw-gtk3-theme
        - btop
        - cascadia-code-nf-fonts
        - dmidecode
        - edk2-ovmf
        - fish
        - gnome-boxes
        - greetd
        - kde-connect
        - kf6-kitemmodels  # required for kde connect plugin settings to work
        - libatomic
        - liquidctl
        - nautilus
        - niri
        - noctalia
        - openconnect
        - swtpm-tools
        - waypipe

  # sysc-greet's own %post RPM scriptlet can't see groups created earlier in
  # the build (RPM scriptlets run sandboxed from live /etc/group, verified
  # via a diagnostic build). Nor do /etc/group changes survive into a later,
  # separate RUN layer. `useradd` itself, even called right after `groupadd`
  # in the very same chain (before dnf5 is even invoked), *still* reports
  # the groups missing - despite `getent group ...` (also NSS-backed)
  # proving those same groups ARE visible right after groupadd creates them.
  # Whatever useradd's own group-existence check does differently from NSS
  # lookups, it doesn't work here. So `groupadd` (proven reliable) creates
  # the groups, but the greeter user and its group memberships are written
  # directly to /etc/passwd, /etc/shadow, /etc/gshadow and /etc/group
  # instead of going through useradd/usermod at all. This replicates
  # sysc-greet's postinstall.sh
  # (github.com/Nomadcxx/sysc-greet/blob/v1.1.9/scripts/postinstall.sh).
  - type: containerfile
    snippets:
      - |
        RUN groupadd -f -r video && \
            groupadd -f -r render && \
            groupadd -f -r input && \
            groupadd -f -r greeter && \
            GREETER_ID=$(awk -F: 'BEGIN{max=200} $3>=200 && $3<1000 && $3>max{max=$3} END{print max+1}' /etc/passwd) && \
            grep -q '^greeter:' /etc/passwd || echo "greeter:x:${GREETER_ID}:${GREETER_ID}::/var/lib/greeter:/usr/bin/nologin" >> /etc/passwd && \
            grep -q '^greeter:' /etc/shadow || echo 'greeter:!:19000:0:99999:7:::' >> /etc/shadow && \
            grep -q '^greeter:' /etc/gshadow || echo 'greeter:!::' >> /etc/gshadow && \
            for g in video render input; do awk -F: -v g="$g" -v OFS=: '$1==g { if ($4=="") {$4="greeter"} else if ($4 !~ /(^|,)greeter(,|$)/) {$4=$4",greeter"} } {print}' /etc/group > /etc/group.new && mv /etc/group.new /etc/group; done && \
            mkdir -p /var/cache/sysc-greet /var/lib/greeter/Pictures/wallpapers /var/lib/greeter/.cache /var/lib/greeter/.config /var/lib/greeter/.local/state /tmp/greeter-cache && \
            chown -R greeter:greeter /var/cache/sysc-greet /var/lib/greeter /tmp/greeter-cache && \
            chmod 755 /var/lib/greeter && \
            printf '%s\n' '[terminal]' 'vt = 1' '' '[default_session]' 'command = "niri -c /etc/greetd/niri-greeter-config.kdl"' 'user = "greeter"' '' '[initial_session]' 'command = "niri -c /etc/greetd/niri-greeter-config.kdl"' 'user = "greeter"' > /etc/greetd/config.toml && \
            dnf5 install -y --setopt=tsflags=noscripts https://github.com/Nomadcxx/sysc-greet/releases/download/v1.1.9/sysc-greet-1.1.9-1.x86_64.rpm

  - type: systemd
    system:
      enabled:
        - greetd.service

  - type: default-flatpaks
    configurations:
      - notify: true # Send notification after install/uninstall is finished (true/false)
        scope: system
        # If no repo information is specified, Flathub will be used by default
        install: # system flatpaks we want all users to have and not remove
          - io.github.kolunmi.Bazaar
          - org.mozilla.firefox
          - org.gnome.Loupe
      - scope: user # Also add Flathub user repo, but no user packages

  - type: signing # this sets up the proper policy & signing files for signed images to work fully
