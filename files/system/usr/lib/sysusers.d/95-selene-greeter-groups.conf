# sysc-greet's postinstall script adds its greeter user to the video/render/
# input supplementary groups. Those groups are normally created dynamically
# by udev at runtime, so they don't exist yet during the image build. Declare
# them here via sysusers.d (the same mechanism greetd itself uses to create
# its own group) so they can be materialized before sysc-greet installs.
g video - -
g render - -
g input - -
