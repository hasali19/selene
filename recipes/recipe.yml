---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# image will be published to ghcr.io/<user>/<name>
name: selene
# description will be included in the image's metadata
description: This is my personal OS image.

# the base image to build on top of (FROM) and the version tag to use
base-image: ghcr.io/ublue-os/base-main
image-version: 44 # latest is also supported if you want new updates ASAP

# module configuration, executed in order
# you can include multiple instances of the same module
modules:
  - type: script
    scripts:
      - install-kernel.sh
      - build-initramfs.sh

  - type: files
    files:
      - source: system
        destination: / # copies files/system/* (* means everything inside it) into your image's root folder /

  - type: dnf
    install:
      packages:
        - adw-gtk3-theme
        - btop
        - cascadia-code-nf-fonts
        - dmidecode
        - edk2-ovmf
        - fish
        - gnome-boxes
        - greetd
        - kde-connect
        - kf6-kitemmodels  # required for kde connect plugin settings to work
        - libatomic
        - liquidctl
        - nautilus
        - niri
        - noctalia
        - openconnect
        - swtpm-tools
        - waypipe

  # sysc-greet's own %post RPM scriptlet can't see groups/users created
  # earlier in the build: RPM scriptlets run in a sandbox that doesn't share
  # live /etc/group state, even within the exact same RUN layer as the
  # install (verified via a diagnostic build: `getent group video render
  # input` succeeds right before dnf5 runs, but sysc-greet's own useradd
  # inside its scriptlet still reports the groups missing). Install with
  # scriptlets disabled and replicate its postinstall.sh ourselves as a
  # plain script instead, which isn't sandboxed and works correctly.
  - type: containerfile
    snippets:
      - RUN groupadd -f -r video; groupadd -f -r render; groupadd -f -r input; dnf5 install -y --setopt=tsflags=noscripts https://github.com/Nomadcxx/sysc-greet/releases/download/v1.1.9/sysc-greet-1.1.9-1.x86_64.rpm

  - type: script
    scripts:
      - sysc-greet-postinstall.sh

  - type: systemd
    system:
      enabled:
        - greetd.service

  - type: default-flatpaks
    configurations:
      - notify: true # Send notification after install/uninstall is finished (true/false)
        scope: system
        # If no repo information is specified, Flathub will be used by default
        install: # system flatpaks we want all users to have and not remove
          - io.github.kolunmi.Bazaar
          - org.mozilla.firefox
          - org.gnome.Loupe
      - scope: user # Also add Flathub user repo, but no user packages

  - type: signing # this sets up the proper policy & signing files for signed images to work fully
