---
# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json
# Modules shared by every selene image variant. Kernel-specific modules live in
# the individual recipe files.
modules:
  - type: files
    files:
      - source: system
        destination: / # copies files/system/* (* means everything inside it) into your image's root folder /

  - type: dnf
    install:
      packages:
        - adw-gtk3-theme
        - btop
        - cascadia-code-nf-fonts
        - dmidecode
        - edk2-ovmf
        - fish
        - gnome-boxes
        - greetd
        - kde-connect
        - kf6-kitemmodels  # required for kde connect plugin settings to work
        - libatomic
        - liquidctl
        - nautilus
        - niri
        - noctalia
        - openconnect
        - swtpm-tools
        - waypipe

  - type: dnf
    repos:
      files:
        - https://github.com/terrapkg/subatomic-repos/raw/main/terra.repo
      cleanup: true
    install:
      packages:
        - terra-release
        - noctalia-greeter

  - type: systemd
    system:
      enabled:
        - greetd.service

  - type: default-flatpaks
    configurations:
      - notify: true # Send notification after install/uninstall is finished (true/false)
        scope: system
        # If no repo information is specified, Flathub will be used by default
        install: # system flatpaks we want all users to have and not remove
          - io.github.kolunmi.Bazaar
          - org.mozilla.firefox
          - org.gnome.Loupe
      - scope: user # Also add Flathub user repo, but no user packages

  - type: signing # this sets up the proper policy & signing files for signed images to work fully
