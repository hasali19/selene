---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# image will be published to ghcr.io/<user>/<name>
name: selene
# description will be included in the image's metadata
description: This is my personal OS image.

# the base image to build on top of (FROM) and the version tag to use
base-image: ghcr.io/ublue-os/base-main
image-version: 44 # latest is also supported if you want new updates ASAP

# module configuration, executed in order
# you can include multiple instances of the same module
modules:
  - type: script
    scripts:
      - install-kernel.sh
      - build-initramfs.sh

  - type: files
    files:
      - source: system
        destination: / # copies files/system/* (* means everything inside it) into your image's root folder /

  - type: dnf
    install:
      packages:
        - adw-gtk3-theme
        - btop
        - cascadia-code-nf-fonts
        - dmidecode
        - edk2-ovmf
        - fish
        - gnome-boxes
        - greetd
        - kde-connect
        - kf6-kitemmodels  # required for kde connect plugin settings to work
        - libatomic
        - liquidctl
        - nautilus
        - niri
        - noctalia
        - openconnect
        - swtpm-tools
        - waypipe

  # DIAGNOSTIC BUILD: sysc-greet's postinstall keeps failing to see the
  # video/render/input groups even when created in the same RUN layer
  # immediately before the install. Print /etc/group state right before
  # dnf5 runs so we can see what's actually happening instead of guessing
  # further blind fixes.
  - type: containerfile
    snippets:
      - RUN groupadd -f -r video; groupadd -f -r render; groupadd -f -r input; echo '=== id/getent state before dnf5 install ==='; id; getent group video render input; grep -E '^(video|render|input):' /etc/group; ls -la /etc/group; dnf5 install -y https://github.com/Nomadcxx/sysc-greet/releases/download/v1.1.9/sysc-greet-1.1.9-1.x86_64.rpm

  - type: systemd
    system:
      enabled:
        - greetd.service

  - type: default-flatpaks
    configurations:
      - notify: true # Send notification after install/uninstall is finished (true/false)
        scope: system
        # If no repo information is specified, Flathub will be used by default
        install: # system flatpaks we want all users to have and not remove
          - io.github.kolunmi.Bazaar
          - org.mozilla.firefox
          - org.gnome.Loupe
      - scope: user # Also add Flathub user repo, but no user packages

  - type: signing # this sets up the proper policy & signing files for signed images to work fully
